name: InputType
options:
  bundleIdPrefix: com.lumocore.inputmethod
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

targets:
  InputType:
    type: application
    platform: macOS
    sources:
      - path: Sources/InputType
        excludes:
          - Resources/**
      - path: Sources/InputType/Resources
        type: group
    settings:
      base:
        PRODUCT_NAME: PrimeType
        PRODUCT_BUNDLE_IDENTIFIER: com.lumocore.inputmethod.PrimeType
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/InputType/Info.plist
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/InputType/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/librime/dist/include"
          - "$(PROJECT_DIR)/Vendor/opus/include"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/librime/dist/lib"
          - "$(PROJECT_DIR)/Vendor/opus/lib"
        OTHER_LDFLAGS:
          - "-lrime"
          - "-lopus"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Embed librime, plugins, and SharedSupport
        basedOnDependencyAnalysis: false
        script: |
          set -e
          FRAMEWORKS_DIR="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          RESOURCES_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${FRAMEWORKS_DIR}/rime-plugins" "${RESOURCES_DIR}"

          cp -f "${PROJECT_DIR}/Vendor/librime/dist/lib/librime.1.17.0.dylib" "${FRAMEWORKS_DIR}/librime.1.dylib"
          codesign --force --sign - "${FRAMEWORKS_DIR}/librime.1.dylib"

          if [ -d "${PROJECT_DIR}/Vendor/librime/dist/lib/rime-plugins" ]; then
            for plugin in "${PROJECT_DIR}/Vendor/librime/dist/lib/rime-plugins"/*.dylib; do
              [ -f "${plugin}" ] || continue
              dest="${FRAMEWORKS_DIR}/rime-plugins/$(basename "${plugin}")"
              cp -f "${plugin}" "${dest}"
              codesign --force --sign - "${dest}"
            done
          fi

          if [ -d "${PROJECT_DIR}/Resources/SharedSupport" ]; then
            rm -rf "${RESOURCES_DIR}/SharedSupport"
            mkdir -p "${RESOURCES_DIR}/SharedSupport"
            rsync -a --exclude='.git' --exclude='.github' --exclude='.DS_Store' \
              "${PROJECT_DIR}/Resources/SharedSupport/" "${RESOURCES_DIR}/SharedSupport/"
          fi

          if [ -d "${PROJECT_DIR}/Resources/Dictionaries" ]; then
            rm -rf "${RESOURCES_DIR}/Dictionaries"
            mkdir -p "${RESOURCES_DIR}/Dictionaries"
            rsync -a --exclude='.git' --exclude='.github' --exclude='.DS_Store' \
              "${PROJECT_DIR}/Resources/Dictionaries/" "${RESOURCES_DIR}/Dictionaries/"
          fi

          if [ -d "${PROJECT_DIR}/Resources/SidebarIcons" ]; then
            rm -rf "${RESOURCES_DIR}/SidebarIcons"
            mkdir -p "${RESOURCES_DIR}/SidebarIcons"
            cp -f "${PROJECT_DIR}/Resources/SidebarIcons/"*.png "${RESOURCES_DIR}/SidebarIcons/"
          fi
